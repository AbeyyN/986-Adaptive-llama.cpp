name: 986 Adaptive CI

on:
  push:
    paths:
      - 'tools/986-adaptive/**'
      - 'docs/986-adaptive/**'
      - '.github/workflows/986-adaptive-ci.yml'
  pull_request:
    paths:
      - 'tools/986-adaptive/**'
      - 'docs/986-adaptive/**'
      - '.github/workflows/986-adaptive-ci.yml'
  workflow_dispatch:

jobs:
  autotune-tests:
    name: AutoTune tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python tools/986-adaptive/test_adaptive986.py
      - name: Smoke test hardware detection
        run: python tools/986-adaptive/adaptive986.py detect
      - name: Smoke test balanced tune
        run: python tools/986-adaptive/adaptive986.py tune --profile balanced --model-gib 4 --format args
